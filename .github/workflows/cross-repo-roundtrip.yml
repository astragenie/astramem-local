# FEAT-411 — cross-repo plugin<->daemon wire-contract gate.
#
# astramem-local is PRIVATE and astramem-plugin is PUBLIC, so this direction
# (daemon repo checking out the public plugin repo) needs no token and is the
# PRIMARY enforcement point: it blocks merge on this repo when a daemon change
# breaks the real plugin's capture -> ingest -> distill -> recall path.
#
# The mirror image (plugin repo checking out this PRIVATE daemon repo) lives in
# astramem-plugin's own .github/workflows/cross-repo-roundtrip.yml and is
# secret-gated (skips cleanly without a PAT) since it can't rely on this repo
# being public from the other side.
#
# Job name is intentionally stable ("cross-repo-roundtrip") so it can be added
# as a required status check in this repo's branch protection settings.

name: Cross-Repo Roundtrip

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# devops#69: 5 self-hosted runners share ONE VM — a re-push must cancel the
# superseded run instead of doubling fleet load.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-repo-roundtrip:
    name: cross-repo-roundtrip
    # Matches every other workflow in this private repo (audit/lint/parity/test
    # all target the org's self-hosted linux pool; keeps hosted-runner minutes
    # at zero and native-module prebuilts on a known-good OS).
    runs-on: [self-hosted, astragenie, aws]
    timeout-minutes: 15
    steps:
      - name: Checkout daemon (this repo)
        uses: actions/checkout@v7
        with:
          path: daemon

      - name: Checkout plugin (public, no token needed)
        uses: actions/checkout@v7
        with:
          repository: astragenie/astramem-plugin
          path: plugin

      # Bun baked into runner image (devops#64) — no setup-bun, but a fleet of
      # self-hosted runners can still race on bun's own cache-restore /
      # lockfile step (issue #93: intermittent ETXTBSY). Retry the install
      # once before failing the job outright.
      # NODE_ENV=development for the same reason as the plugin install below:
      # a leaked NODE_ENV=production would make `bun install` skip
      # devDependencies (typescript), breaking `bun run build` (tsc) — symmetric
      # guard so the flake can't reappear one step earlier with a `tsc`-not-found
      # symptom.
      - name: Install + build daemon
        working-directory: daemon
        env:
          NODE_ENV: development
        run: |
          set -e
          for attempt in 1 2; do
            if bun install --frozen-lockfile; then
              break
            fi
            if [ "$attempt" = "2" ]; then
              echo "::error::bun install failed after 2 attempts (daemon)"
              exit 1
            fi
            echo "bun install attempt $attempt failed (ETXTBSY/cache race?) — retrying in 5s..."
            sleep 5
          done
          bun run build

      # Self-hosted runner may inherit NODE_ENV=production from prior jobs,
      # which makes bun install skip devDependencies (vitest) — force dev deps.
      # Same ETXTBSY/cache-race retry guard as the daemon install above.
      - name: Install plugin dependencies
        working-directory: plugin
        env:
          NODE_ENV: development
        run: |
          set -e
          # Pin the @astragenie scope to public npmjs BEFORE install. The plugin
          # repo gitignores .npmrc (it holds a GitHub Packages token at publish
          # time), so the repo-local scope route never reaches a fresh checkout —
          # and a runner-global ~/.npmrc that points @astragenie at GitHub
          # Packages would 404 the 2.x contracts line (only legacy 1.x lives on
          # GH Packages). Without this, `bun install --frozen-lockfile` resolves
          # @astragenie/astramem-contracts@2.4.0 against an unscoped default-
          # registry path and 404s. Mirrors the plugin's own lint.yml/test.yml.
          echo "@astragenie:registry=https://registry.npmjs.org" >> .npmrc
          for attempt in 1 2; do
            if bun install --frozen-lockfile; then
              break
            fi
            if [ "$attempt" = "2" ]; then
              echo "::error::bun install failed after 2 attempts (plugin)"
              exit 1
            fi
            echo "bun install attempt $attempt failed (ETXTBSY/cache race?) — retrying in 5s..."
            sleep 5
          done

      # devops#75: fetch a PREBUILT better-sqlite3-multiple-ciphers binary for the
      # node ABI the smoke actually runs under (node v22 -> ABI v127) instead of
      # compiling it on the runner.
      #
      # Why: the addon is a bun-workspace dependency hoisted to the repo-root
      # node_modules, which is where the spawned daemon (and test:smoke) resolves
      # it from. `bun install` skips the package's `install` script
      # (`prebuild-install || node-gyp rebuild`), so no .node is produced, and the
      # plugin `bun install` above re-materialises the hoisted package. #127
      # patched this with an on-runner `npm rebuild`, but the node-gyp compile
      # RACES across the 5 co-located self-hosted runners (shared ~/.bun store +
      # hoist re-materialisation, cf. #69/#93) and its load-guard was a TOCTOU: a
      # stale .node that passed the guard could be wiped by a concurrent job
      # before test:smoke ran. A prebuilt removes the compile entirely ->
      # deterministic on every runner, no toolchain dependency, no race.
      #
      # Must run under NODE (ABI v127) -- bun reports ABI v137 and would fetch the
      # wrong binary. A node-v127-linux-x64 prebuilt is published for 12.11.1
      # (github.com/m4heshd/better-sqlite3-multiple-ciphers releases). Runs AFTER
      # the plugin install, and resolves the package location via node so it
      # targets whichever node_modules the addon is actually hoisted to.
      #
      # Supply-chain hardening: rather than let `prebuild-install` pull an
      # unverified binary, download the exact release asset and check it against a
      # PINNED sha256 before extracting. The three coordinates below (package
      # version, node ABI, platform) and the SHA move together — if the lockfile
      # bumps the package, or the runner's node ABI changes, the download's hash
      # will not match and this step fails LOUDLY, forcing an intentional re-pin
      # (recompute: curl -fsSL "$URL" | sha256sum). Do not "fix" a hash mismatch
      # by relaxing the check -- verify the new asset first.
      - name: Fetch + verify prebuilt SQLCipher addon for the smoke's node ABI
        env:
          NODE_ENV: development
          PKG_VERSION: '12.11.1'
          NODE_ABI: 'v127'
          PLATFORM: 'linux-x64'
          SHA256: '46a4933d6962aa75cee61657b99931dd23cc040fc81094a3ec33b3b09328cdea'
        run: |
          set -euo pipefail
          # Fail early if the runner's actual node ABI drifts from the pinned one.
          actual_abi="v$(node -e 'process.stdout.write(process.versions.modules)')"
          if [ "$actual_abi" != "$NODE_ABI" ]; then
            echo "::error::runner node ABI is $actual_abi but this step is pinned to $NODE_ABI — bump NODE_ABI + SHA256 together for the matching prebuilt."
            exit 1
          fi
          pkg_dir="$(node -e "process.stdout.write(require('path').dirname(require.resolve('better-sqlite3-multiple-ciphers/package.json')))")"
          echo "cipher package resolves to: $pkg_dir"
          asset="better-sqlite3-multiple-ciphers-v${PKG_VERSION}-node-${NODE_ABI}-${PLATFORM}.tar.gz"
          url="https://github.com/m4heshd/better-sqlite3-multiple-ciphers/releases/download/v${PKG_VERSION}/${asset}"
          tmp="$(mktemp)"
          echo "downloading $url"
          curl -fsSL --retry 3 --retry-delay 2 "$url" -o "$tmp"
          echo "${SHA256}  ${tmp}" | sha256sum -c -
          # Prebuilt tarball layout is build/Release/better_sqlite3.node — extract
          # straight into the resolved package dir (no node-gyp, no compile race).
          tar -xzf "$tmp" -C "$pkg_dir"
          rm -f "$tmp"
          # Verify under node -- the runtime the spawned daemon actually uses.
          node -e "require('better-sqlite3-multiple-ciphers'); console.log('verified prebuilt addon loads under node ABI', process.versions.modules)"

      # AC-1/AC-2: ASTRAMEM_LOCAL_DIST_PATH must be the daemon REPO ROOT
      # (containing dist/cli/index.js after build), not the dist/ dir itself —
      # see tests/e2e/plugin-daemon-roundtrip.test.ts gating comment in the
      # plugin repo. `test:smoke` runs vitest, which exits non-zero on any
      # assertion failure (e.g. a fused score > 1 wire violation) — this job
      # goes red and blocks merge, it does not swallow failures.
      - name: Run plugin<->daemon roundtrip test
        working-directory: plugin
        env:
          ASTRAMEM_LOCAL_DIST_PATH: ${{ github.workspace }}/daemon
        run: bun run test:smoke
