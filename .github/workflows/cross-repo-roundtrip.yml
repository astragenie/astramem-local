# FEAT-411 — cross-repo plugin<->daemon wire-contract gate.
#
# astramem-local is PRIVATE and astramem-plugin is PUBLIC, so this direction
# (daemon repo checking out the public plugin repo) needs no token and is the
# PRIMARY enforcement point: it blocks merge on this repo when a daemon change
# breaks the real plugin's capture -> ingest -> distill -> recall path.
#
# The mirror image (plugin repo checking out this PRIVATE daemon repo) lives in
# astramem-plugin's own .github/workflows/cross-repo-roundtrip.yml and is
# secret-gated (skips cleanly without a PAT) since it can't rely on this repo
# being public from the other side.
#
# Job name is intentionally stable ("cross-repo-roundtrip") so it can be added
# as a required status check in this repo's branch protection settings.

name: Cross-Repo Roundtrip

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# devops#69: 5 self-hosted runners share ONE VM — a re-push must cancel the
# superseded run instead of doubling fleet load.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-repo-roundtrip:
    name: cross-repo-roundtrip
    # Matches every other workflow in this private repo (audit/lint/parity/test
    # all target the org's self-hosted linux pool; keeps hosted-runner minutes
    # at zero and native-module prebuilts on a known-good OS).
    runs-on: [self-hosted, astragenie, aws]
    timeout-minutes: 15
    steps:
      - name: Checkout daemon (this repo)
        uses: actions/checkout@v7
        with:
          path: daemon

      - name: Checkout plugin (public, no token needed)
        uses: actions/checkout@v7
        with:
          repository: astragenie/astramem-plugin
          path: plugin

      # Bun baked into runner image (devops#64) — no setup-bun, but a fleet of
      # self-hosted runners can still race on bun's own cache-restore /
      # lockfile step (issue #93: intermittent ETXTBSY). Retry the install
      # once before failing the job outright.
      # NODE_ENV=development for the same reason as the plugin install below:
      # a leaked NODE_ENV=production would make `bun install` skip
      # devDependencies (typescript), breaking `bun run build` (tsc) — symmetric
      # guard so the flake can't reappear one step earlier with a `tsc`-not-found
      # symptom.
      - name: Install + build daemon
        working-directory: daemon
        env:
          NODE_ENV: development
        run: |
          set -e
          for attempt in 1 2; do
            if bun install --frozen-lockfile; then
              break
            fi
            if [ "$attempt" = "2" ]; then
              echo "::error::bun install failed after 2 attempts (daemon)"
              exit 1
            fi
            echo "bun install attempt $attempt failed (ETXTBSY/cache race?) — retrying in 5s..."
            sleep 5
          done
          bun run build

      # issue #93: on some self-hosted runners the node-gyp compile of the
      # native better-sqlite3-multiple-ciphers addon is skipped or silently
      # fails during `bun install` (stale/incomplete toolchain state on that
      # runner), leaving no `.node` binary present. Left unchecked this
      # surfaces steps later as an opaque "Could not locate the bindings
      # file" error from inside the roundtrip smoke test. Verify the addon
      # loads right after install; if it doesn't, force a rebuild and
      # re-verify, so a genuine toolchain gap fails here with a clear message
      # instead of a confusing downstream test error.
      - name: Verify native addon (better-sqlite3-multiple-ciphers)
        working-directory: daemon
        env:
          NODE_ENV: development
        run: |
          set -e
          if node -e "require('better-sqlite3-multiple-ciphers')" 2>addon-check.log; then
            echo "native addon present and loadable"
          else
            echo "native addon missing/broken on this runner — forcing rebuild:"
            cat addon-check.log
            npm rebuild better-sqlite3-multiple-ciphers --build-from-source || bun install --force
            if node -e "require('better-sqlite3-multiple-ciphers')"; then
              echo "native addon rebuilt successfully"
            else
              echo "::error::better-sqlite3-multiple-ciphers could not be built on this runner after a forced rebuild — this is a real toolchain gap (check python3/make/g++ on this runner image), not a flake."
              exit 1
            fi
          fi
          rm -f addon-check.log

      # Self-hosted runner may inherit NODE_ENV=production from prior jobs,
      # which makes bun install skip devDependencies (vitest) — force dev deps.
      # Same ETXTBSY/cache-race retry guard as the daemon install above.
      - name: Install plugin dependencies
        working-directory: plugin
        env:
          NODE_ENV: development
        run: |
          set -e
          for attempt in 1 2; do
            if bun install --frozen-lockfile; then
              break
            fi
            if [ "$attempt" = "2" ]; then
              echo "::error::bun install failed after 2 attempts (plugin)"
              exit 1
            fi
            echo "bun install attempt $attempt failed (ETXTBSY/cache race?) — retrying in 5s..."
            sleep 5
          done

      # issue #93 / devops#75: better-sqlite3-multiple-ciphers is a bun-workspace
      # dependency HOISTED to the repo-root node_modules
      # (astramem-local/node_modules/...), which is where `test:smoke` resolves
      # it from — NOT plugin/ or daemon/. `bun install` produces no node-ABI
      # native build, and the plugin `bun install` above re-materialises the
      # hoisted package, wiping any .node the earlier daemon rebuild produced.
      # So `test:smoke` (vitest under node ABI v127) intermittently fails "Could
      # not locate the bindings file", passing only when a prior job left the
      # root addon compiled on the self-hosted runner. Rebuild the ROOT addon
      # here — after the last bun install, before the smoke test — so the ABI is
      # satisfied deterministically. Runs at the repo root (no working-directory).
      - name: Rebuild root SQLCipher addon for the smoke test's node ABI
        env:
          NODE_ENV: development
        run: |
          set -e
          if node -e "require('better-sqlite3-multiple-ciphers')" 2>addon-check.log; then
            echo "root native addon present and loadable"
          else
            echo "root native addon missing/broken on this runner — forcing rebuild:"
            cat addon-check.log
            npm rebuild better-sqlite3-multiple-ciphers --build-from-source || bun install --force
            if node -e "require('better-sqlite3-multiple-ciphers')"; then
              echo "root native addon rebuilt successfully"
            else
              echo "::error::better-sqlite3-multiple-ciphers could not be built on this runner after a forced rebuild — a real toolchain gap (check python3/make/g++ on this runner image), not a flake."
              exit 1
            fi
          fi
          rm -f addon-check.log

      # AC-1/AC-2: ASTRAMEM_LOCAL_DIST_PATH must be the daemon REPO ROOT
      # (containing dist/cli/index.js after build), not the dist/ dir itself —
      # see tests/e2e/plugin-daemon-roundtrip.test.ts gating comment in the
      # plugin repo. `test:smoke` runs vitest, which exits non-zero on any
      # assertion failure (e.g. a fused score > 1 wire violation) — this job
      # goes red and blocks merge, it does not swallow failures.
      - name: Run plugin<->daemon roundtrip test
        working-directory: plugin
        env:
          ASTRAMEM_LOCAL_DIST_PATH: ${{ github.workspace }}/daemon
        run: bun run test:smoke
