name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# devops#69: 5 self-hosted runners share ONE VM — a re-push must cancel the
# superseded run instead of doubling fleet load.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript type-check
    runs-on: [self-hosted, astragenie, aws]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Bun is baked into the runner image at /usr/local/bin (devops#64) —
      # setup-bun's cache-restore/exec race caused intermittent ETXTBSY.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # TypeScript IS the lint in this repo.
      # tsc --noEmit catches type errors without emitting output files.
      # A full build (npm run build) is also run in test.yml on each matrix cell;
      # this job catches type regressions quickly on a single fast runner.
      - name: Type-check (tsc --noEmit)
        run: bunx tsc --noEmit

      # tsconfig.json's rootDir/include is src/** only, so the step above never
      # sees scripts/eval/** — the harness that produces every published eval
      # number (LoCoMo, LongMemEval, extraction-bench, recall-quality,
      # proxy-bench). tsconfig.eval.json extends the same strict settings and
      # scopes to that tree; wire it in separately so a scripts/eval-only
      # regression fails loudly here instead of silently on `bun run build`.
      - name: Type-check eval harness (tsc --noEmit)
        run: bun run typecheck:eval

      # tsconfig.json's include is src/** only, so neither step above ever
      # type-checks tests/** — issue #235: `bun run typecheck:tests` had
      # never run in CI, so every @ts-expect-error / satisfies / type-only
      # fixture in the test tree was decoration that passed once locally and
      # never ran again. Wired in here, same pattern as typecheck:eval above.
      - name: Type-check tests (tsc --noEmit)
        run: bun run typecheck:tests

      # contracts/ is the cross-repo technical constitution (ADR-001/003/005)
      # — cheap, fast, no build step. Cloud repo CI runs the same
      # `node contracts/validate.mjs` invocation against these same files.
      - name: Validate contracts (JSON Schema + golden fixtures)
        run: node contracts/validate.mjs
