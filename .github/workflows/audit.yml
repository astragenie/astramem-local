name: bun audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# devops#69: 5 self-hosted runners share ONE VM — a re-push must cancel the
# superseded run instead of doubling fleet load.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: [self-hosted, astragenie, aws]
    steps:
      - uses: actions/checkout@v7
      # Bun baked into runner image (devops#64) — no setup-bun, no ETXTBSY race.
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Fail on high/critical vulnerabilities
        run: bun audit --audit-level=high
