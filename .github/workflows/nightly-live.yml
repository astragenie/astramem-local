# FEAT-421 / SLICE-415 — Nightly live-provider CI lane.
#
# The INTEGRATION_LIVE=ollama gated tests (tests/providers/ollama-*.test.ts,
# tests/e2e/plugin-flow.test.ts) exist but run nowhere automatically — real
# Ollama drift (model renames, API changes, embed-dim changes like the
# nomic-embed-text-v2-moe 768-dim vs mxbai-embed-large 1024-dim incident
# behind hotfix v0.2.1) is only caught when a human runs them locally or a
# user hits it in production. This lane wires those EXISTING tests into a
# nightly run against a real Ollama — no new test authorship.
#
# Deliberately separate from push/PR CI: merges must never depend on Ollama
# availability. Triggers are schedule + workflow_dispatch ONLY.
#
# Runner: self-hosted fleet (fleet policy — no GitHub-hosted runners; see
# test.yml / audit.yml / lint.yml). The "5 runners" in this pool are actually
# 5 job slots on ONE shared, persistent Linux EC2 host — there is no `ollama`
# label, so this workflow probes port 11434 first: if a host-level Ollama is
# already running (singleton, potentially shared with other jobs/repos on the
# same box), it reuses it rather than starting a second instance and fighting
# over the port; only if nothing answers does it start its own container
# (`docker` label is present on this host, per astragenie/devops#64). It never
# installs anything system-wide, to avoid the documented ETXTBSY-style races
# this shared host hits under concurrent global-tooling installs.
#
# Cold start binds an EPHEMERAL host port rather than a second fixed :11434 —
# this workflow's own concurrency group serializes repeat runs of THIS
# workflow, but not against other repos'/jobs' unrelated Ollama usage on the
# same shared box, so two unrelated cold starts landing on :11434 at once
# would race for the port. OLLAMA_HOST is exported (warm reuse pins it to
# :11434; cold start pins it to whatever ephemeral port Docker assigned) and
# is what every later step, and the live tests themselves, target — see the
# "Probe" and "Start Ollama (docker)" steps.
#
# Model cache: actions/cache keyed on the OLLAMA_MODELS env value below —
# bump a model tag here and the cache key changes automatically, forcing a
# fresh pull instead of silently serving a stale blob.
#
# Model policy: the embed block still names the PRODUCTION default (config.ts),
# never a pinned legacy tag — a stale pin there means this lane exercises a
# model no user has while real embed-dim drift in the actual default goes
# unnoticed. The LLM block is a DELIBERATE exception (2026-07-14, Option A /
# CPU-runner fix): this self-hosted runner has no GPU/VRAM, real generation
# is CPU-only and slow, so the LLM live test was narrowed to call only
# `.health()` (GET /api/tags — no inference). That check needs *some* model
# present in the tags list, not the production default specifically, so it
# is pinned to a tiny CPU-friendly model (qwen2.5:0.5b) instead of the real
# (large) production LLM default. This trades away one narrow drift signal
# (did the production default's exact tag get renamed/removed from the
# registry) in exchange for a lane that reliably finishes on CPU-only
# hardware; production LLM *generation* drift is covered by the
# extraction-bench on a GPU box, not here.

name: Nightly Live Provider CI

on:
  schedule:
    # 09:17 UTC nightly — off-the-hour to avoid GitHub Actions' cron thundering herd.
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-live
  cancel-in-progress: false

env:
  # Single source of truth for the models this lane needs. Space-separated;
  # also drives the actions/cache key below (OLLAMA_CACHE_VERSION-bump or a
  # model-tag change here invalidates the cache automatically).
  # qwen2.5:0.5b (not the production LLM default) — the LLM live test only
  # needs a model present in `/api/tags` for its `.health()` check, never
  # runs generation; see "Model policy" above. Keep this in sync with the
  # hardcoded model tag in tests/providers/ollama-llm.test.ts's live block.
  OLLAMA_MODELS: "mxbai-embed-large qwen2.5:0.5b"
  OLLAMA_CACHE_VERSION: v1
  OLLAMA_CONTAINER: ollama-nightly-live

jobs:
  nightly-live:
    name: nightly-live
    runs-on: [self-hosted, astragenie, aws, docker]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Bun baked into runner image (devops#64) — no setup-bun, no ETXTBSY race.
      - name: Install dependencies (native rebuild included)
        run: bun install --frozen-lockfile

      - name: Build (TypeScript)
        run: bun run build

      - name: Restore Ollama model cache
        # Explicit restore/save (not the combined actions/cache@v4 action):
        # its auto-save post step only fires on success(), and this job
        # deliberately exits 1 on a red live-test result (see "Fail job if
        # red" below) so the Actions UI shows red — which would silently
        # skip cache save on every red run and defeat the cache entirely,
        # since the known nomic-embed-text-v2-moe drift makes red the
        # common case today. The explicit save step below runs on
        # `always()`, gated only on the model pulls themselves succeeding.
        id: ollama-cache
        uses: actions/cache/restore@v6
        with:
          path: /opt/ollama-models
          key: ollama-models-${{ env.OLLAMA_CACHE_VERSION }}-${{ env.OLLAMA_MODELS }}

      - name: Probe for existing Ollama
        # This host is shared (5 job slots on 1 EC2 box, no `ollama` label) —
        # treat Ollama as a host singleton. If something already answers on
        # :11434 (ours from a prior run, or another job's), reuse it instead
        # of starting a second instance and fighting over the port.
        id: probe
        run: |
          if curl -sf http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
            echo "found=1" >> "$GITHUB_OUTPUT"
            echo "OLLAMA_HOST=http://127.0.0.1:11434" >> "$GITHUB_ENV"
            echo "Existing Ollama service detected on :11434 — reusing it, not starting a container."
          else
            echo "found=0" >> "$GITHUB_OUTPUT"
            echo "No Ollama on :11434 — starting one via Docker."
          fi

      - name: Preflight — Ollama CLI presence on host
        # Distinct from the port-11434 probe above: this checks whether the
        # `ollama` binary itself is installed on the runner host (even if not
        # currently running as a service), so a future maintainer can tell
        # "no service running" apart from "no binary present at all" (FEAT-421
        # diagnostic — see .github/workflows/README.md nightly-live section).
        run: |
          ollama --version || echo "OLLAMA_MISSING"
          which ollama || echo "ollama binary not found on PATH"

      - name: Start Ollama (docker)
        # Ephemeral host port (`-p 11434` with no host side) instead of a
        # pinned `11434:11434` — this is a fresh, private instance for this
        # run only (no cross-repo reuse on cold start), so it doesn't need
        # the fixed port, and skipping it removes the race against other
        # jobs on this shared host cold-starting at the same moment.
        if: steps.probe.outputs.found == '0'
        run: |
          mkdir -p "/opt/ollama-models"
          # Defensive: a previous crashed run may have left a stale container
          # on this (persistent, shared) self-hosted host.
          docker rm -f "$OLLAMA_CONTAINER" >/dev/null 2>&1 || true
          docker run -d --name "$OLLAMA_CONTAINER" \
            -p 11434 \
            -v "/opt/ollama-models:/root/.ollama" \
            ollama/ollama:latest
          OLLAMA_PORT=$(docker port "$OLLAMA_CONTAINER" 11434/tcp | head -n1 | cut -d: -f2)
          echo "OLLAMA_HOST=http://127.0.0.1:${OLLAMA_PORT}" >> "$GITHUB_ENV"
          echo "Cold-started Ollama on ephemeral host port ${OLLAMA_PORT}"

      - name: Wait for Ollama API
        run: |
          for i in $(seq 1 60); do
            if curl -sf "${OLLAMA_HOST}/api/tags" >/dev/null 2>&1; then
              echo "Ollama ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Ollama did not become ready in time" >&2
          docker logs "$OLLAMA_CONTAINER" 2>&1 || true
          exit 1

      - name: Pull models
        # Pull via the Ollama HTTP API rather than `docker exec` — this works
        # identically whether Ollama is the container we just started or a
        # pre-existing host-level singleton we reused (which may not even be
        # a container we can `docker exec` into).
        run: |
          for model in $OLLAMA_MODELS; do
            echo "::group::pull $model"
            curl -sf "${OLLAMA_HOST}/api/pull" \
              -d "{\"name\": \"$model\"}" | tail -c 2000
            echo
            echo "::endgroup::"
          done

      - name: Fix model cache directory ownership
        # The Ollama container runs as root, so files it writes into the
        # bind-mounted .ollama-models/ (e.g. its internal id_ed25519 key,
        # cache/model-recommendations.json) end up root-owned. The runner
        # process invoking `tar` for actions/cache/save is unprivileged and
        # can't read them ("Permission denied", confirmed on run 28708537635),
        # so hand ownership back via a throwaway container before saving.
        # No-op (and harmless) when reusing a pre-existing host Ollama, since
        # nothing was written into this path in that case.
        if: always()
        run: |
          docker run --rm -v "/opt/ollama-models:/data" \
            alpine chown -R "$(id -u):$(id -g)" /data

      - name: Save Ollama model cache
        # Explicit save (see the restore-step comment above): runs whenever
        # the model pulls themselves succeeded, independent of whether the
        # later live-test step passes or the job as a whole ends red.
        if: always()
        uses: actions/cache/save@v6
        with:
          path: /opt/ollama-models
          key: ollama-models-${{ env.OLLAMA_CACHE_VERSION }}-${{ env.OLLAMA_MODELS }}

      - name: Run INTEGRATION_LIVE=ollama test subset
        # tests/e2e/plugin-flow.test.ts is deliberately NOT in this subset —
        # see the "Run E2E pipeline (mock mode)" step below. This runner has
        # no GPU/VRAM, so real Ollama generation is CPU-only; that test's
        # live mode drives a full ingest->distill->search pipeline through
        # several real LLM calls (compaction + extraction), which is slow on
        # CPU and previously timed out here (nightly-live run 28793332627,
        # documented in .github/workflows/README.md "Known risks" #2). The
        # two tests that remain are cheap drift checks: ollama-llm.test.ts's
        # live block only calls `.health()` (GET /api/tags, no inference),
        # and ollama-embed.test.ts's live block checks real embed dims — both
        # fast on CPU. Generation-quality drift is the extraction-bench's job
        # on a GPU box, not this lane's.
        id: live-tests
        continue-on-error: true
        env:
          INTEGRATION_LIVE: ollama
        run: |
          bun run test -- \
            tests/providers/ollama-llm.test.ts \
            tests/providers/ollama-embed.test.ts \
            --testTimeout=60000 \
            --reporter=default --reporter=json --outputFile=live-test-results.json

      - name: Run E2E pipeline (mock mode)
        # Exercises the full ingest->distill->search pipeline that
        # plugin-flow.test.ts's "full pipeline" test drives — deliberately
        # WITHOUT INTEGRATION_LIVE set, so it runs against the mock LLM/embed
        # providers (ASTRA_MEMORY_MOCK_PROVIDERS=1, see IS_MOCK in that test
        # file) instead of real Ollama generation. Deterministic, ~4s, and
        # still catches wiring regressions in the pipeline itself; it just
        # doesn't exercise real-model drift (that's live-tests' job above,
        # narrowed to health/embed-dim checks only on this CPU-only runner).
        id: e2e-mock-tests
        continue-on-error: true
        run: |
          bun run test -- \
            tests/e2e/plugin-flow.test.ts \
            --reporter=default --reporter=json --outputFile=e2e-mock-test-results.json

      - name: Run smoke suite
        id: smoke-tests
        continue-on-error: true
        run: |
          bun run test:smoke -- \
            --reporter=default --reporter=json --outputFile=smoke-test-results.json

      - name: Run soak suite
        # Timing/host-scheduling-sensitive load tests, excluded from the
        # blocking PR/main gate (vitest.config.ts) to keep it deterministic —
        # see that file's tests/soak/** exclude comment. They run HERE nightly
        # via their own config (vitest.soak.config.ts). No Ollama dependency
        # (induced-saturation + mock providers), so they don't rely on any of
        # the Ollama setup above. A red here is a signal to investigate the
        # worker-throttle governor, not a merge blocker.
        id: soak-tests
        continue-on-error: true
        run: |
          bun run test:soak -- \
            --testTimeout=60000 \
            --reporter=default --reporter=json --outputFile=soak-test-results.json

      - name: Extract failing test names
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            const names = [];
            for (const f of ['live-test-results.json', 'e2e-mock-test-results.json', 'smoke-test-results.json', 'soak-test-results.json']) {
              if (!fs.existsSync(f)) continue;
              let data;
              try { data = JSON.parse(fs.readFileSync(f, 'utf8')); } catch { continue; }
              for (const tr of data.testResults ?? []) {
                for (const ar of tr.assertionResults ?? []) {
                  if (ar.status === 'failed') names.push(ar.fullName || ar.title || '(unnamed test)');
                }
              }
            }
            fs.writeFileSync('failing-tests.txt', names.join('\n'));
            console.log('failing test count:', names.length);
          "

      - name: Compute overall result
        id: result
        if: always()
        run: |
          if [ "${{ steps.live-tests.outcome }}" = "success" ] && [ "${{ steps.e2e-mock-tests.outcome }}" = "success" ] && [ "${{ steps.smoke-tests.outcome }}" = "success" ] && [ "${{ steps.soak-tests.outcome }}" = "success" ]; then
            echo "status=green" >> "$GITHUB_OUTPUT"
          else
            echo "status=red" >> "$GITHUB_OUTPUT"
          fi

      - name: Update pinned nightly-live issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const status = '${{ steps.result.outputs.status }}';
            const failing = fs.existsSync('failing-tests.txt') ? fs.readFileSync('failing-tests.txt', 'utf8').trim() : '';
            const title = 'nightly-live: red';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            const existing = issues.find((i) => i.title === title);

            if (status === 'red') {
              const body = [
                'Nightly live-provider CI failed.',
                '',
                `Run: ${runUrl}`,
                '',
                'Failing tests:',
                '```',
                failing || '(no structured test names captured — see run log)',
                '```',
              ].join('\n');

              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'open',
                  body,
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `Still red: ${runUrl}`,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                });
              }
            } else if (existing && existing.state === 'open') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Green run: ${runUrl}. Closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
              });
            }

      - name: Stop Ollama container
        # Only tear down the container if THIS run started it — never stop a
        # host-level Ollama singleton (or another job's container) we merely
        # reused, since other jobs on this shared host may depend on it.
        if: always() && steps.probe.outputs.found == '0'
        run: docker rm -f "$OLLAMA_CONTAINER" >/dev/null 2>&1 || true

      - name: Fail job if red
        if: always()
        run: |
          if [ "${{ steps.result.outputs.status }}" = "red" ]; then
            echo "Nightly live-provider lane is red — see the pinned issue and step logs above." >&2
            exit 1
          fi
