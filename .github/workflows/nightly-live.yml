# FEAT-421 / SLICE-415 — Nightly live-provider CI lane.
#
# The INTEGRATION_LIVE=ollama gated tests (tests/providers/ollama-*.test.ts,
# tests/e2e/plugin-flow.test.ts) exist but run nowhere automatically — real
# Ollama drift (model renames, API changes, embed-dim changes like the
# nomic-embed-text-v2-moe 768-dim vs mxbai-embed-large 1024-dim incident
# behind hotfix v0.2.1) is only caught when a human runs them locally or a
# user hits it in production. This lane wires those EXISTING tests into a
# nightly run against a real Ollama — no new test authorship.
#
# Deliberately separate from push/PR CI: merges must never depend on Ollama
# availability. Triggers are schedule + workflow_dispatch ONLY.
#
# Runner: self-hosted fleet (fleet policy — no GitHub-hosted runners; see
# test.yml / audit.yml / lint.yml). The "5 runners" in this pool are actually
# 5 job slots on ONE shared, persistent Linux EC2 host — there is no `ollama`
# label, so this workflow probes port 11434 first: if a host-level Ollama is
# already running (singleton, potentially shared with other jobs/repos on the
# same box), it reuses it rather than starting a second instance and fighting
# over the port; only if nothing answers does it start its own container
# (`docker` label is present on this host, per astragenie/devops#64). It never
# installs anything system-wide, to avoid the documented ETXTBSY-style races
# this shared host hits under concurrent global-tooling installs.
#
# Model cache: actions/cache keyed on the OLLAMA_MODELS env value below —
# bump a model tag here and the cache key changes automatically, forcing a
# fresh pull instead of silently serving a stale blob.
#
# KNOWN RISK (documented, not fixed — out of this slice's scope): the live
# block in tests/providers/ollama-embed.test.ts still hardcodes the model
# name `nomic-embed-text-v2-moe` (pre-v0.2.1-hotfix reference). That model is
# natively 768-dim; OllamaEmbedProvider defaults to expecting 1024
# (DEFAULT_EMBED_DIM) regardless of which model string is passed, so a real
# run of that specific test is expected to fail with a dimension-mismatch
# error until the test itself is updated. This is exactly the class of drift
# this lane exists to surface — see the nightly-live section of
# .github/workflows/README.md for triage guidance.

name: Nightly Live Provider CI

on:
  schedule:
    # 09:17 UTC nightly — off-the-hour to avoid GitHub Actions' cron thundering herd.
    - cron: '17 9 * * *'
  workflow_dispatch:
  # TEMP-TESTING-ONLY: workflow_dispatch cannot target a workflow file that
  # only exists on a non-default branch. This push trigger is scoped to this
  # feature branch so SLICE-415 AC-2 can be exercised with a real dispatched
  # run before merge, and MUST be removed before this workflow lands on main.
  push:
    branches: [feat/FEAT-421-nightly-live-ci]

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-live
  cancel-in-progress: false

env:
  # Single source of truth for the models this lane needs. Space-separated;
  # also drives the actions/cache key below (OLLAMA_CACHE_VERSION-bump or a
  # model-tag change here invalidates the cache automatically).
  OLLAMA_MODELS: "mxbai-embed-large qwen2.5-coder:7b nomic-embed-text-v2-moe"
  OLLAMA_CACHE_VERSION: v1
  OLLAMA_CONTAINER: ollama-nightly-live

jobs:
  nightly-live:
    name: nightly-live
    runs-on: [self-hosted, astragenie, aws, docker]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Bun baked into runner image (devops#64) — no setup-bun, no ETXTBSY race.
      - name: Install dependencies (native rebuild included)
        run: bun install --frozen-lockfile

      - name: Build (TypeScript)
        run: bun run build

      - name: Restore Ollama model cache
        id: ollama-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ollama-models
          key: ollama-models-${{ env.OLLAMA_CACHE_VERSION }}-${{ env.OLLAMA_MODELS }}

      - name: Probe for existing Ollama
        # This host is shared (5 job slots on 1 EC2 box, no `ollama` label) —
        # treat Ollama as a host singleton. If something already answers on
        # :11434 (ours from a prior run, or another job's), reuse it instead
        # of starting a second instance and fighting over the port.
        id: probe
        run: |
          if curl -sf http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
            echo "found=1" >> "$GITHUB_OUTPUT"
            echo "Existing Ollama service detected on :11434 — reusing it, not starting a container."
          else
            echo "found=0" >> "$GITHUB_OUTPUT"
            echo "No Ollama on :11434 — starting one via Docker."
          fi

      - name: Start Ollama (docker)
        if: steps.probe.outputs.found == '0'
        run: |
          mkdir -p "${{ github.workspace }}/.ollama-models"
          # Defensive: a previous crashed run may have left a stale container
          # on this (persistent, shared) self-hosted host.
          docker rm -f "$OLLAMA_CONTAINER" >/dev/null 2>&1 || true
          docker run -d --name "$OLLAMA_CONTAINER" \
            -p 11434:11434 \
            -v "${{ github.workspace }}/.ollama-models:/root/.ollama" \
            ollama/ollama:latest

      - name: Wait for Ollama API
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
              echo "Ollama ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Ollama did not become ready in time" >&2
          docker logs "$OLLAMA_CONTAINER" 2>&1 || true
          exit 1

      - name: Pull models
        run: |
          for model in $OLLAMA_MODELS; do
            echo "::group::pull $model"
            docker exec "$OLLAMA_CONTAINER" ollama pull "$model"
            echo "::endgroup::"
          done

      - name: Run INTEGRATION_LIVE=ollama test subset
        id: live-tests
        continue-on-error: true
        env:
          INTEGRATION_LIVE: ollama
        run: |
          bun run test -- \
            tests/providers/ollama-llm.test.ts \
            tests/providers/ollama-embed.test.ts \
            tests/e2e/plugin-flow.test.ts \
            --testTimeout=60000 \
            --reporter=default --reporter=json --outputFile=live-test-results.json

      - name: Run smoke suite
        id: smoke-tests
        continue-on-error: true
        run: |
          bun run test:smoke -- \
            --reporter=default --reporter=json --outputFile=smoke-test-results.json

      - name: Extract failing test names
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            const names = [];
            for (const f of ['live-test-results.json', 'smoke-test-results.json']) {
              if (!fs.existsSync(f)) continue;
              let data;
              try { data = JSON.parse(fs.readFileSync(f, 'utf8')); } catch { continue; }
              for (const tr of data.testResults ?? []) {
                for (const ar of tr.assertionResults ?? []) {
                  if (ar.status === 'failed') names.push(ar.fullName || ar.title || '(unnamed test)');
                }
              }
            }
            fs.writeFileSync('failing-tests.txt', names.join('\n'));
            console.log('failing test count:', names.length);
          "

      - name: Compute overall result
        id: result
        if: always()
        run: |
          if [ "${{ steps.live-tests.outcome }}" = "success" ] && [ "${{ steps.smoke-tests.outcome }}" = "success" ]; then
            echo "status=green" >> "$GITHUB_OUTPUT"
          else
            echo "status=red" >> "$GITHUB_OUTPUT"
          fi

      - name: Update pinned nightly-live issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const status = '${{ steps.result.outputs.status }}';
            const failing = fs.existsSync('failing-tests.txt') ? fs.readFileSync('failing-tests.txt', 'utf8').trim() : '';
            const title = 'nightly-live: red';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            });
            const existing = issues.find((i) => i.title === title);

            if (status === 'red') {
              const body = [
                'Nightly live-provider CI failed.',
                '',
                `Run: ${runUrl}`,
                '',
                'Failing tests:',
                '```',
                failing || '(no structured test names captured — see run log)',
                '```',
              ].join('\n');

              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: 'open',
                  body,
                });
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `Still red: ${runUrl}`,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                });
              }
            } else if (existing && existing.state === 'open') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Green run: ${runUrl}. Closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
              });
            }

      - name: Stop Ollama container
        # Only tear down the container if THIS run started it — never stop a
        # host-level Ollama singleton (or another job's container) we merely
        # reused, since other jobs on this shared host may depend on it.
        if: always() && steps.probe.outputs.found == '0'
        run: docker rm -f "$OLLAMA_CONTAINER" >/dev/null 2>&1 || true

      - name: Fail job if red
        if: always()
        run: |
          if [ "${{ steps.result.outputs.status }}" = "red" ]; then
            echo "Nightly live-provider lane is red — see the pinned issue and step logs above." >&2
            exit 1
          fi
