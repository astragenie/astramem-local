# TEMPORARY — delete after one green pass on all runner slots.
# Runs 1-4 of nightly-live (pre /opt-path fix) bind-mounted the Ollama model
# dir INSIDE the checkout workspace; the root container left root-owned files
# there, and now actions/checkout's clean step fails with EACCES on every
# contaminated runner slot (observed: run 28709136832). This one-shot matrix
# fans 5 jobs across the 5 slots and removes the dir via a root container.
# No checkout step on purpose — checkout is the thing that's broken.
name: tmp-cleanup-runner-workspaces
on:
  push:
    branches: [feat/FEAT-421-nightly-live-ci]
jobs:
  cleanup:
    strategy:
      matrix:
        slot: [1, 2, 3, 4, 5]
      max-parallel: 5
    runs-on: [self-hosted, astragenie, aws, docker]
    timeout-minutes: 5
    steps:
      - name: Purge root-owned .ollama-models from this slot's workspace
        run: |
          echo "workspace: $GITHUB_WORKSPACE (slot job ${{ matrix.slot }})"
          if [ -d "$GITHUB_WORKSPACE/.ollama-models" ]; then
            docker run --rm -v "$GITHUB_WORKSPACE:/w" alpine rm -rf /w/.ollama-models
            echo "purged"
          else
            echo "clean already"
          fi
