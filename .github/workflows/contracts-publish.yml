# contracts-publish.yml — publish @astragenie/astramem-contracts to npmjs.org
# (public) on a dedicated tag push (unification execution plan U-publish gate).
#
# WHY: astramem cloud (.NET conformance/CI oracle) and astramem-plugin (TS)
# both need to consume contracts/ as an out-of-tree dependency instead of a
# vendored copy or git-submodule.
#
# WHY npmjs.org, NOT GitHub Packages: npm packages on GitHub Packages inherit
# the SOURCE REPO's visibility (only ghcr containers get independent
# visibility). astramem-local is a PRIVATE repo, so the package could only be
# private there — and private GitHub Packages are metered against the org's
# paid Packages quota behind a $1 hard-stop budget (prevent_further_usage),
# which 403s every publish with "Account has reached its billing limit"
# (this blocked contracts-v2.0.0). Making it public on GitHub Packages would
# require publishing the whole daemon repo publicly — a non-starter. npmjs.org
# is a registry NOT tied to GitHub repo visibility, so the package can be
# public (free, unlimited) while the source repo stays private.
#
# VISIBILITY: PUBLIC (publishConfig.access=public, `npm publish --access
# public`). Payload is only wire-contract schemas, generated types/zod, and
# SYNTHETIC golden fixtures — no secrets, no user data (scanned) — safe to
# expose. Owner explicitly approved public exposure of the contracts.
#
# TAG NAMESPACE: uses `contracts-v*`, NOT the root package's `v*` tag scheme
# (see publish.yml / version-tag-parity.yml). This repo publishes TWO
# independent npm packages (root @astragenie/astramemory-local + this one) —
# sharing the `v*` tag would either double-trigger both publish jobs on every
# tag or force the two packages to release in lockstep, which they must not:
# contracts/package.json semver tracks contracts-package changes (schema
# additions, fixture updates, generated-type regen), which is a SEPARATE axis
# from the wire_version field embedded inside envelopes (e.g. "capture@1",
# "sync@1" in contracts/schemas/*.schema.json). A contracts package minor/patch
# bump does NOT imply a wire_version bump, and a wire_version bump (breaking
# envelope change) forces at least a package major bump but is authored and
# reviewed independently. Tag format: `contracts-v1.2.3` -> package.json
# version `1.2.3`.
#
# AUTH: publish authenticates to npmjs.org with an npm Automation access token
# stored as the repo secret NPM_TOKEN (Automation tokens bypass 2FA, required
# for CI). The `astragenie` npm org/scope must exist and the token owner must
# have publish rights on it. The GITHUB_TOKEN / packages:write path no longer
# applies — this publishes to npmjs, not GitHub Packages.
#
# CONSUMPTION (separate concern, not this workflow): because the package is
# PUBLIC on npmjs.org — the default public registry — astramem-plugin's CI and
# any engineer's local install resolve @astragenie/astramem-contracts with NO
# auth and NO .npmrc scope mapping. Do NOT scope @astragenie to GitHub Packages
# in a consumer's .npmrc, or npm will look for this package on GH Packages
# (private, billing-gated) instead of npmjs.
#
# Runs on the self-hosted fleet, consistent with every other workflow here.

name: contracts publish

on:
  push:
    tags:
      - 'contracts-v*'

permissions:
  contents: read

jobs:
  publish:
    name: npm publish (GitHub Packages)
    runs-on: [self-hosted, astragenie, aws]
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches contracts/package.json
        run: |
          PKG_VERSION=$(jq -r '.version' package.json)
          TAG="${GITHUB_REF_NAME#contracts-v}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::contracts/package.json ($PKG_VERSION) != tag ($TAG) — bump contracts/package.json in the release PR"
            exit 1
          fi

      # node 22 matches the repo's engines floor (>=22); registry-url writes the
      # npmjs auth line into .npmrc. No `scope:` — publishConfig.registry in
      # contracts/package.json already targets npmjs, mirroring publish.yml.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install root deps (generator toolchain lives at repo root)
        working-directory: .
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Regenerate + validate (fail if generated output is stale)
        working-directory: .
        run: |
          bun run contracts:build
          git diff --exit-code -- contracts/types contracts/zod || {
            echo "::error::generated types/zod are stale — run 'bun run contracts:build' and commit before tagging";
            exit 1;
          }

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
