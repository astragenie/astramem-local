# publish.yml — npm publish on version-tag push (W2.3, hardening-roadmap Wave 2).
#
# WHY: the registry froze at 0.4.0 while the repo moved to 0.6.x. Users who
# `bun install -g` got a build without the SQLCipher driver, which dies with
# SQLITE_NOTADB against an encrypted database (the stale-global-install trap).
# Publishing every release tag keeps the registry current so that trap class
# cannot recur.
#
# REQUIRES: repo secret NPM_TOKEN (npm automation token with publish rights
# on @astragenie). Without it the publish step fails loudly — by design.
#
# Runs on the self-hosted fleet (no GitHub-hosted runners — fleet policy).
# npm --provenance uses the same Actions OIDC token on self-hosted runners.

name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: npm publish
    runs-on: [self-hosted, astragenie, aws]
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches package.json (same gate as version-tag-parity)
        run: |
          PKG_VERSION=$(jq -r '.version' package.json)
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::package.json ($PKG_VERSION) != tag ($TAG) — bump package.json in the release PR"
            exit 1
          fi

      # Bun baked into runner image (devops#64); setup-node kept for registry-url auth.
      # node 22 matches the package's engines floor (>=22) and the better-sqlite3-
      # multiple-ciphers prebuilt matrix (no node-20 prebuilt exists).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install + build
        # --ignore-scripts skips dependency postinstall scripts — specifically
        # better-sqlite3's node-gyp native compile, which crashes on the fleet
        # runner (bunx node-gyp@latest pulls an undici incompatible with the
        # runner Node: "webidl.util.markAsUncloneable is not a function", and
        # no prebuilt binary exists for the target). The publish only needs the
        # TS build (dist/) — better-sqlite3 is a RUNTIME dep the consumer
        # compiles on their own install, and its .d.ts types (all tsc needs)
        # are present without the native build. See issue #58.
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build

      # --provenance is intentionally NOT used: npm rejects sigstore provenance
      # from self-hosted runners (E422 "Unsupported GitHub Actions runner
      # environment: self-hosted"), and fleet policy is self-hosted only
      # (devops#64). Provenance would require a github-hosted runner. See #58.
      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
